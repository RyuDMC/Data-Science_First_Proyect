name: Deploy subfolder to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job único que construye (sube) y despliega
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 🔑 Paso CRÍTICO: Sube la carpeta 'reporte'
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # La ruta DEBE ser relativa a la raíz del repo.
          # Si 'reporte' está en la raíz, esto es correcto.
          path: 'reporte'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
