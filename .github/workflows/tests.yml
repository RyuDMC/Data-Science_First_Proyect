name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ejecutar la suite
        run: python -m pytest -q tests/
      - name: Verificar metadatos
        run: python codes/generar_metadata.py --check
      - name: Verificar tabla canónica
        run: python codes/crear_canonicos.py --check
